name: Build iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Generate project
        run: |
          echo "::add-matcher::.github/swift-problem-matcher.json"
          brew install xcodegen
          xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project MagRead.xcodeproj -scheme MagRead
      - name: Unit tests on iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          mkdir -p build
          set -o pipefail
          xcodebuild test -project MagRead.xcodeproj -scheme MagRead -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tee build/test-output.log
      - name: Publish test diagnostics
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool get object --legacy --format json --path build/TestResults.xcresult > build/test-result.json
          fi
          python3 scripts/report_tests.py
      - name: Build unsigned device app
        run: |
          xcodebuild build -project MagRead.xcodeproj -scheme MagRead -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO -quiet
          mkdir -p build/IPA/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/MagRead.app build/IPA/Payload/
          cd build/IPA
          /usr/bin/zip -qry ../MagRead-unsigned.ipa Payload
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: MagRead-iOS-unsigned
          path: build/MagRead-unsigned.ipa
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: |
            build/TestResults.xcresult
            build/test-output.log
            build/test-result.json
          if-no-files-found: ignore
          retention-days: 7
